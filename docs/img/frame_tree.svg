<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; ry: 10; }
      .box-accent { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 10; ry: 10; }
      .box-task { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 10; ry: 10; }
      .box-sensor { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2; rx: 10; ry: 10; }
      .label { font-family: monospace; font-size: 18px; fill: #0f172a; }
      .small { font-family: sans-serif; font-size: 14px; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <text x="40" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">WBMM coordinate frames</text>

  <rect class="box" rx="10" ry="10" x="60" y="90" width="190" height="58"/>
  <text class="label" x="82" y="126">world / map</text>

  <rect class="box" x="340" y="90" width="190" height="58" rx="10" ry="10"/>
  <text class="label" x="392" y="126">odom</text>

  <rect class="box" x="620" y="90" width="250" height="58" rx="10" ry="10"/>
  <text class="label" x="642" y="126">base_footprint</text>

  <rect class="box-accent" x="620" y="190" width="250" height="58" rx="10" ry="10"/>
  <text class="label" x="670" y="226">base_link</text>

  <rect class="box-accent" x="620" y="290" width="250" height="58" rx="10" ry="10"/>
  <text class="label" x="644" y="326">jaka_base_link</text>

  <rect class="box-accent" x="620" y="390" width="250" height="58" rx="10" ry="10"/>
  <text class="label" x="640" y="426">joint_1 ... joint_6</text>

  <rect class="box-accent" x="620" y="490" width="250" height="58" rx="10" ry="10"/>
  <text class="label" x="684" y="526">tool0 / ee_link</text>

  <rect class="box-task" x="60" y="330" width="250" height="58" rx="10" ry="10"/>
  <text class="label" x="86" y="366">task_frame / surface</text>

  <rect class="box-sensor" x="60" y="470" width="250" height="58" rx="10" ry="10"/>
  <text class="label" x="88" y="506">sensor frames</text>

  <path class="arrow" d="M 250 119 L 340 119"/>
  <path class="arrow" d="M 530 119 L 620 119"/>
  <path class="arrow" d="M 745 148 L 745 190"/>
  <path class="arrow" d="M 745 248 L 745 290"/>
  <path class="arrow" d="M 745 348 L 745 390"/>
  <path class="arrow" d="M 745 448 L 745 490"/>

  <path class="arrow" d="M 620 359 C 520 359, 440 359, 310 359"/>
  <path class="arrow" d="M 620 519 C 520 519, 440 519, 310 499"/>

  <text class="small" x="262" y="106">map -> odom</text>
  <text class="small" x="540" y="106">odom -> base</text>
  <text class="small" x="754" y="177">robot base</text>
  <text class="small" x="754" y="277">fixed mount</text>
  <text class="small" x="754" y="377">serial chain</text>
  <text class="small" x="754" y="477">TCP / EE</text>
  <text class="small" x="78" y="420">task frame: surface normal + tangent</text>
  <text class="small" x="78" y="560">camera / force sensor / other sensors</text>
</svg>
