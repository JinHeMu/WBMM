# Common OCS2 MPC/MRT parameters shared by real and simulation profiles.
wbmm_mpc_node:
  ros__parameters:
    use_sim_time: false
    robot_name: mobile_manipulator
    whole_body_target_topic: mobile_manipulator_whole_body_target
    ee_target_topic: mobile_manipulator_ee_target
    task_phase_state_topic: mobile_manipulator_task_phase_state
    set_task_phase_service: mobile_manipulator_set_task_phase
    initial_task_phase: -1

wbmm_mrt_node:
  ros__parameters:
    use_sim_time: false
    command_output_enabled: false
    robot_name: mobile_manipulator
    task_phase_state_topic: mobile_manipulator_task_phase_state
    initial_task_phase: -1

    mrt_loop_rate: 125.0
    traj_horizon: 0.10
    arm_max_command_velocity: 0.15
    arm_max_delta_per_step: 0.05

    # Hard clamp on the published base command. Must match
    # jointVelocityLimits/wheelBasedMobileManipulator in the task file:
    #   config/real/task*.info  -> v in [-0.1, 0.1], w in [-0.4, 0.4]
    #   config/sim/task*.info   -> v in [-0.5, 0.5], w in [-1.0, 1.0]
    # (overridden in config/sim/ocs2.yaml).
    base_max_linear_velocity: 0.1
    base_max_angular_velocity: 0.4

    # Must match the consumer's message type. Both backends consume plain
    # geometry_msgs/Twist, so keep this false:
    #   sim  -> mujoco_bridge_node.py subscribes Twist on /base_controller/cmd_vel
    #   real -> tracer_base_node subscribes Twist on /cmd_vel
    #           (tracer_base/tracer_messenger.hpp:57)
    # A mismatch fails silently: publisher and subscriber simply never match
    # and no base command is delivered, with no error on either side.
    #
    # Do NOT switch this to true based on the diff_drive_controller entry in
    # tracer_jaka_description/config/ros2_controllers.yaml: that controller
    # sets use_stamped_vel: true but is never spawned by any launch file, and
    # the URDF declares left_wheel/right_wheel as fixed joints, so it could
    # not drive the base anyway. It is dead config.
    use_stamped_cmd: false
    base_cmd_topic: /cmd_vel
    odom_topic: /odometry/filtered
    joint_state_topic: /joint_states
    arm_cmd_topic: /arm_controller/commands
    base_frame: base_footprint
    # Keep this equal to whole_body_force_control.state_frame.
    world_frame: odom
    # Keep this equal to force_sensor.tcp_frame in the force-control profile.
    ee_frame: tool0
    arm_joint_names:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    enable_visualization: true
    viz_self_collision: true
    viz_rate: 20.0

wbmm_target_node:
  ros__parameters:
    use_sim_time: false
    robot_name: mobile_manipulator
    marker_frame: odom
    ee_frame: tool0
    ee_target_topic: mobile_manipulator_ee_target
    marker_scale: 0.3
    input_dim: 8
