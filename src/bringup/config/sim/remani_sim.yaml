# REMANI launch-argument tuning for the MuJoCo simulation profile.
# Values are forwarded by common/remani.launch.py to the vendor
# remani_mpc_tracking.launch.py arguments.
tracking_error_replan_enabled: true
tracking_error_position_threshold: 0.30
tracking_error_yaw_threshold: 0.45
tracking_error_joint_threshold: 0.30
tracking_error_persistence: 0.30
tracking_error_min_interval: 2.0
tracking_error_grace_period: 0.60
tracking_goal_position_tolerance: 0.12
tracking_goal_yaw_tolerance: 0.20
tracking_goal_joint_tolerance: 0.15
tracking_goal_replan_position_threshold: 0.40
tracking_goal_replan_yaw_threshold: 0.70
tracking_goal_replan_joint_threshold: 0.45
tracking_goal_replan_persistence: 1.00
max_consecutive_planning_failures: 20
manipulator_max_vel: 1.57
manipulator_max_acc: 3.14
manipulator_safe_margin: 0.10
general_safe_margin: 0.10
self_safe_margin: 0.10
freeze_manipulator: false
