# MuJoCo OCS2 overrides. Common structure lives in config/common/ocs2.yaml.
wbmm_mpc_node:
  ros__parameters:
    use_sim_time: true

wbmm_mrt_node:
  ros__parameters:
    use_sim_time: true
    command_output_enabled: true
    traj_horizon: 1.0
    arm_max_command_velocity: 0.50
    arm_max_delta_per_step: 0.50
    base_cmd_topic: /base_controller/cmd_vel

wbmm_target_node:
  ros__parameters:
    use_sim_time: true
