# MuJoCo OCS2 overrides. Common structure lives in config/common/ocs2.yaml.
wbmm_mpc_node:
  ros__parameters:
    use_sim_time: true

wbmm_mrt_node:
  ros__parameters:
    use_sim_time: true
    command_output_enabled: true
    # The MPC publishes only `solutionTimeWindow` (0.5 s) of policy, so the
    # look-ahead used to build the arm position command must stay inside that
    # window. With traj_horizon >= the window the MRT always commands the arm
    # to the very last point of the plan (queryTime is clamped to planEnd),
    # i.e. 0.5 s into the future, which whips the arm whenever the plan is
    # stale.
    traj_horizon: 0.10
    arm_max_command_velocity: 0.50
    # 0.50 rad/step at 125 Hz is 62.5 rad/s, i.e. no limit at all: the MPC
    # joint-velocity constraint is only +/-2.0 rad/s. 0.05 rad/step is
    # 6.25 rad/s and still leaves headroom over the 1.57 rad/s REMANI
    # reference. Keep this identical to the real profile.
    arm_max_delta_per_step: 0.05
    # Hard clamp applied to the base command before publishing. Must match
    # jointVelocityLimits/wheelBasedMobileManipulator in the task file.
    base_max_linear_velocity: 0.5
    base_max_angular_velocity: 1.0
    base_cmd_topic: /base_controller/cmd_vel

wbmm_target_node:
  ros__parameters:
    use_sim_time: true
